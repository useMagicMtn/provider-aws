name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: provider
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: provider
          persist-credentials: false
      - name: Read SDK revision
        id: sdk
        run: echo "revision=$(cat SDK_REVISION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: useMagicMtn/magicmtn
          ref: ${{ steps.sdk.outputs.revision }}
          path: magicmtn
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Configure SDK and Python
        run: |
          cp .cargo/config.toml.example .cargo/config.toml
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --features bedrock-only
      - run: cargo check --locked --lib --no-default-features
      - run: .venv/bin/python -m unittest discover -s tests -p 'test_*.py'
      - run: cargo test --locked
      - run: ./package.sh
      - run: cargo test --locked --test rpc maintainer_archive_runs_with_standard_sdk_host -- --ignored
